name: Mirror Ombre Brain Image

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and Push
        run: |
          docker pull p0luz/ombre-brain:latest
          docker tag p0luz/ombre-brain:latest xiane1216/ombre-brain:latest
          docker push xiane1216/ombre-brain:latest
          docker images
